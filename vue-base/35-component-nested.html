<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组件的嵌套</title>
    <script src="../js/vue.js"></script>
</head>

<!--
	关于VueComponent：
        1.school组件本质是一个名为VueComponent的构造函数，且不是程序员定义的，是Vue.extend生成的。

        2.我们只需要写<school/>或<school></school>，Vue解析时会帮我们创建school组件的实例对象，
            即Vue帮我们执行的：new VueComponent(options)。

        3.特别注意：每次调用Vue.extend，返回的都是一个全新的VueComponent！！！！注意这一点很重要

        4.关于this指向：
                (1).组件配置中：
                            data函数、methods中的函数、watch中的函数、computed中的函数 它们的this均是【VueComponent实例对象】。
                (2).new Vue(options)配置中：
                            data函数、methods中的函数、watch中的函数、computed中的函数 它们的this均是【Vue实例对象】。

        5.VueComponent的实例对象，以后简称vc（也可称之为：组件实例对象）。
            Vue的实例对象，以后简称vm。 vm管理着一个又一个vc，vc可以再
        6.因为组件是可复用的 Vue 实例，所以它们与 new Vue 接收相同的选项，例如 data、computed、watch、methods 以及生命周期钩子等。仅有的例外是像 el 这样根实例特有的选项。
          所以vm与vc属性配置并不是一模一样，尽管vc底层复用了很多vm的逻辑

        7.一个重要的内置关系：VueComponent.prototype.__proto__ === Vue.prototype
        8.为什么要有这个关系：让组件实例对象（vc）可以访问到 Vue原型上的属性、方法。
-->

<body>

<div id="app">
    <app></app>
</div>
<br>

<script>
    const student = Vue.extend({
        template: `
          <div>
            <h2>学生姓名：{{ studentName }}</h2>
            <h2>学生年龄：{{ age }}</h2>
          </div>
        `,
        data() {
            return {
                studentName: '张三',
                age: 18
            }
        }
    })

    const school = Vue.extend({
        template: `
          <div>
            <h2>学校名称：{{ schoolName }}</h2>
            <h2>学校地址：{{ address }}</h2>
            <button @click="showName">点我打印学校名称</button>
            <button @click="printObj">点我输出</button>
            <student></student>
          </div>
        `,
        // 这里data必须写成函数形式 避免多次使用组件导致共用data对象导致一个问题
        data() {
            return {
                schoolName: '清华大学',
                address: '北京海淀区清华园'
            }
        },
        methods: {
            showName() {
                alert(this.schoolName)
            },
            printObj() {
                // VueComponent实例对象
                console.log(this)
                // VueComponent实例对象隐式原型属性 指向VueComponent原型对象
                // 但是VueComponent原型对象的__proto__指向Vue.prototype，没有指向Object
                console.log(this.__proto__.__proto__ === Vue.prototype)
            }
        },
        components: {student}
    })



    const app = Vue.extend({
        template: `
          <div>
            <school></school>
          </div>
        `,
        components: {school}
    })

    const vm = new Vue({
        el: '#app',
        components: {app}
    })

    // Vue.prototype和vm.__proto__都指向vue原型对象，返回true
    console.log(vm.__proto__ === Vue.prototype)

    function Demo() {
        this.a = 1
        this.b = 2
    }

    Demo.prototype.c = 3

    const d = new Demo()
    // Demo实例对象d的隐式原型属性 指向Demo的原型对象
    console.log(d.__proto__ === Demo.prototype)
    // 同时实例对象上也有c属性
    console.log(d.__proto__.c)
</script>
</body>

</html>
