<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v-cloak使用</title>
    <script src="../js/vue.js"></script>
    <!--    <script type="text/javascript" src="http://localhost:8080/5s/vue.js" defer></script>-->
    <style>
        [v-cloak] {
            display: none;
        }
    </style>
</head>

<!--
    v-cloak指令（没有值）：
        1.本质是一个特殊属性，Vue实例创建完毕并接管容器后，会删掉v-cloak属性。
        2.使用css配合v-cloak可以解决网速慢时页面展示出{{xxx}}的问题。
-->

<body>
<div id="app">
    <!--先出现插值表达式，再渲染数据-->
    <h2>{{name}}</h2>
    <!--使用css把v-cloak设置为不展示-->
    <h2 v-cloak>{{name}}</h2>
</div>
<!--注意要放在div外面-->
<!--使用node启动js文件夹里的server.js-->
<script type="text/javascript" src="http://localhost:8080/resource/5s/vue.js"></script>
<script>
    console.log(111)
    const vm = new Vue({
        el: '#app',
        data: {
            name: 'hello'
        }
    })
</script>
</body>

</html>
