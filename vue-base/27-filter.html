<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>过滤器</title>
    <script src="../js/vue.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/dayjs/1.11.13/dayjs.min.js"></script>
</head>
<!-- 			
    过滤器：
        定义：对要显示的数据进行特定格式化后再显示（适用于一些简单逻辑的处理）。
        语法：
            1.注册过滤器：Vue.filter(name,callback) 或 new Vue{filters:{}}
            2.使用过滤器：{{ xxx | 过滤器名}}  或  v-bind:属性 = "xxx | 过滤器名"
        备注：
            1.过滤器也可以接收额外参数、多个过滤器也可以串联
            2.并没有改变原本的数据, 是产生新的对应的数据
-->

<body>
    <div id='app'>
        <h1>显示格式化后的时间</h1>
        <h2>计算属性实现,当前时间为：{{ fmtDate }}</h2>
        <h2>js方法实现,当前时间为：{{ getFmtDate() }}</h2>
        <h2>过滤器实现1,当前时间为：{{ time | timeFormater}}</h2>
        <!-- 多次过滤 time 传参timeFormater 之后的返回值，再传参 mySlice -->
        <h2>过滤器实现2,当前年份为：{{ time | timeFormater | mySlice}}</h2>
    </div>
    <script>
        // 全局过滤器要在Vue实例之前配置
        Vue.filter('mySlice', function (val) {
            return val.slice(0, 4)
        })
        const vm = new Vue({
            el: '#app',
            data: {
                time: Date.now()
            },
            computed: {
                fmtDate() {
                    return dayjs(this.time).format('YYYY-MM-DD HH:mm:ss')
                }
            },
            methods: {
                getFmtDate() {
                    return dayjs(this.time).format('YYYY-MM-DD HH:mm:ss')
                }
            },
            filters: {
                timeFormater(val, str = 'YYYY-MM-DD HH:mm:ss') {
                    return dayjs(val).format(str)
                }
            }
        })
    </script>
</body>

</html>
