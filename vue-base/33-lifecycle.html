<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生命周期</title>
    <script src="../js/vue.js"></script>
</head>

<!--
    生命周期：
        1.又名：生命周期回调函数、生命周期函数、生命周期钩子。
        2.是什么：Vue在关键时刻帮我们调用的一些特殊名称的函数。
        3.生命周期函数的名字不可更改，但函数的具体内容是程序员根据需求编写的。
        4.生命周期函数中的this指向是vm 或 组件实例对象。

    常用的生命周期钩子：
        1.mounted: 发送ajax请求、启动定时器、绑定自定义事件、订阅消息等【初始化操作】。
        2.beforeDestroy: 清除定时器、解绑自定义事件、取消订阅消息等【收尾工作】。

    关于销毁Vue实例
        1.销毁后借助Vue开发者工具看不到任何信息。
        2.销毁后自定义事件会失效，但原生DOM事件依然有效。(click之类的原生事件依然会被调用[新版本vue也移除了原生事件])
        3.一般不会在beforeDestroy操作数据，因为即便操作数据，也不会再触发更新流程了。
-->

<body>

<div id="app">
    <!--原生写法-->
    <h2 style="opacity: 0.2">欢迎学习Vue</h2>
    <!--vue正常写法-->
    <h2 v-bind:style="{opacity: opacity}">欢迎学习Vue</h2>
    <!--简写-->
    <h2 v-bind:style="{opacity}">欢迎学习Vue</h2>
</div>
<br>

<script>

    const vm = new Vue({
        // 如果不写el，页面就不会使用vue进行渲染，需要手动调用vm.$mount('#app')
        el: '#app',
        // 如果配置了template，那么会将template中的内容替换el指定的元素，原el指定的元素中内容会被覆盖。
        // template模版字符串只能有一个根结点，同时template是不能作为根标签来使用的
        template: `
            <div>
              <h2 v-bind:style="{opacity: opacity}">欢迎学习Vue</h2>
              <button @click="stopChange">点我停止变换</button>
              <button @click="bye">点我销毁</button>
              <h2>n的数值：{{n}}</h2>
              <button @click="add">点我n++</button>
            </div>
        `,
        data: {
            opacity: 1,
            n: 1,
            timer: null
        },
        methods: {
            change() {
                this.timer = setInterval(() => {
                    vm.opacity -= 0.01
                    while (vm.opacity <= 0) {
                        vm.opacity = 1
                    }
                }, 20)
            },
            stopChange() {
              clearInterval(this.timer)
            },
            bye() {
                // 销毁组件
                console.log('bye')
                this.$destroy()
            },
            add() {
                console.log('add')
                this.n++
            }
        },
        beforeCreate() {
            console.log('beforeCreated')
        },
        created() {
            console.log('created')
        },
        beforeMount() {
            console.log('beforeMount')
        },
        mounted() {
            console.log('mounted')
            this.change()
        },
        beforeUpdate() {
            // 此时数据是新的，页面还是旧的，vue还没根据新的数据去生成新的虚拟dom，去比较旧的虚拟dom
            console.log('beforeUpdate, n = ', this.n)
        },
        updated() {
            // 此时数据是新的，页面也是新的，同步
            console.log('updated')
        },
        // 在控制台使用 vm.$destroy() 就会触发 beforeDestroy 和 destroyed
        beforeDestroy() {
            console.log('beforeDestroy')
            // 一旦到了beforeDestroy或者destroyed钩子，即使你拿到数据想要更新它也不会走更新的路了(beforeUpdate,updated)
            // this.add();
            clearInterval(this.timer)
        },
        destroyed() {
            console.log('destroyed')
        }
    })

    // 使用外部定时器实现，不推荐
    // setInterval(() => {
    //     console.log('opacity = ', vm.opacity)
    //     vm.opacity -= 0.01
    //     while (vm.opacity <= 0) {
    //         vm.opacity = 1
    //     }
    // }, 20)
</script>
</body>

</html>
