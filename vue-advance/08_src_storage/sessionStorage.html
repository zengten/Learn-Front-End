<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>session-storage</title>
</head>
<body>
<button onclick="saveItem()">点我保存一个数据</button>
<button onclick="getItem()">点我读取一个数据</button>
<button onclick="deleteItem()">点我删除一个数据</button>
<button id="btn">点我删除全部数据</button>
</body>
<script>
    function saveItem() {
        // key和value必须为字符串
        sessionStorage.setItem('msg', 'msgValue')
        // 对象类型需要使用JSON.stringify
        sessionStorage.setItem('user', JSON.stringify({'name': '张三', 'age': 10}))
    }

    // 如果读取的数据不存在，会返回null
    function getItem() {
        const msgValue = sessionStorage.getItem('msg')
        console.log(msgValue)
        const user = sessionStorage.getItem('user');
        console.log(user);
    }

    function deleteItem() {
        sessionStorage.removeItem('msg')
    }

    btn.onclick = function deleteAllItem() {
        sessionStorage.clear()
    }
</script>
</html>
